<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Gestão de Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <!--
    type="module" ativa os módulos ES no navegador (import/export),
    o mesmo conceito de módulos que você já estudou, sem bundler.
    Não há <script> inline nem onclick="": o Helmet (CSP) bloquearia.
    Todos os eventos são ligados com addEventListener nos arquivos .js.
  -->
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- TELA DE LOGIN -->
  <main id="login-screen" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <div class="logo">GC</div>
      <div>
        <h1>Bem-vindo de volta</h1>
        <p class="muted">Entre para gerenciar seus clientes.</p>
      </div>
      <label>E-mail<input name="email" type="email" autocomplete="username" required /></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="btn primary block">Entrar</button>
    </form>
  </main>

  <!-- PAINEL -->
  <div id="app-shell" class="shell" hidden>
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand"><span class="logo sm">GC</span>Gestão</div>
    </header>

    <aside class="sidebar">
      <div class="brand"><span class="logo sm">GC</span>Gestão</div>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
        <a href="#/clientes" data-route="clientes">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Clientes</a>
        <a href="#/contatos" data-route="contatos">
          <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Contatos</a>
        <a href="#/pagamentos" data-route="pagamentos">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Cobranças</a>
        <a href="#/financeiro" data-route="financeiro">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Financeiro</a>
        <a href="#/servicos" data-route="servicos">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Serviços</a>
      </nav>
      <div class="sidebar-foot">
        <a href="#/configuracoes" data-route="configuracoes" class="user-link">
          <span class="avatar" id="user-initial"></span>
          <span><strong id="user-name"></strong><span class="muted small">Configurações</span></span>
        </a>
        <button id="logout-btn" class="btn ghost small block" type="button">Sair</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <main id="view" class="content"></main>
  </div>

  <!-- MODAL genérico (formulários) -->
  <dialog id="modal">
    <form id="modal-form" method="dialog" novalidate>
      <header><h2 id="modal-title"></h2></header>
      <div id="modal-body" class="form-grid"></div>
      <p id="modal-error" class="form-error" hidden></p>
      <footer>
        <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="modal-submit">Salvar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
